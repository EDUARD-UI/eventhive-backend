spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# Proxy/Forwarding para Render
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Codificación
server.tomcat.uri-encoding=UTF-8

# Optimización de memoria: Limitar hilos y conexiones de Tomcat
# (Por defecto Tomcat reserva hasta 200 hilos, consumiendo gran cantidad de memoria nativa y stacks)
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Evita N+1 al cargar asociaciones lazy después de paginar entidades raíz.
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# No permitir paginación en memoria por fetch de colecciones.
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Optimización de memoria: Reducir tamaño del caché de planes de consulta de Hibernate
# (Por defecto guarda hasta 2048 planes que retienen árboles AST y metadatos en heap)
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=64