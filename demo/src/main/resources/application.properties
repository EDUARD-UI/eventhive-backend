spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.include=dev
server.port=${PORT:8080}

server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.uri-encoding=UTF-8
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20

spring.jmx.enabled=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=2048

# Cache (Caffeine en RAM)
spring.cache.type=caffeine

groq.api.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api.key=${Eventhive-HiveBot:${EVENTHIVE_HIVEBOT:${GROQ_API_KEY:${OPENAI_API_KEY:}}}}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.temperature=${GROQ_TEMPERATURE:0.2}
groq.api.max-tokens=${GROQ_MAX_TOKENS:250}
groq.api.rpm-limit=${GROQ_RPM_LIMIT:25}

spring.ai.openai.base-url=${groq.api.base-url}
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.chat.options.model=${groq.api.model}
spring.ai.openai.chat.options.temperature=${groq.api.temperature}