# SUPABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MONGODB
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB}

# SUPABASE STORAGE
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SECRET_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# BUCKETS
supabase.bucket.verificaciones=verificacion-docs
supabase.bucket.eventos=eventos-images
supabase.bucket.categorias=categorias-images
supabase.bucket.banners-home=banners-home
supabase.bucket.perfil-organizacion=perfilOrganizacion
supabase.bucket.imagen-perfil=imagenPerfil

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HIKARI
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuración Gmail API OAuth 2.0
gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.sender=${GMAIL_SENDER:eventhiveContacto@gmail.com}
gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/oauth2/callback/google}
gmail.application-name=EventHive

# Remitente de EventHive y reintentos
eventhive.mail.remitente=${GMAIL_SENDER:eventhiveContacto@gmail.com}
eventhive.mail.nombre-remitente=${MAIL_FROM_NAME:EventHive}
eventhive.mail.max-reintentos=${MAIL_MAX_REINTENTOS:2}

# URL del frontend
eventhive.frontend-url=${FRONTEND_URL:https://eventhive-ruby-zeta.vercel.app}

