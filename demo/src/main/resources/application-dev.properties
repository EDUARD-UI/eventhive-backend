# SUPABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MONGODB
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB}

# SUPABASE STORAGE
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SECRET_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# BUCKETS
supabase.bucket.verificaciones=verificacion-docs
supabase.bucket.eventos=eventos-images
supabase.bucket.categorias=categorias-images
supabase.bucket.banners-home=banners-home
supabase.bucket.perfil-organizacion=perfilOrganizacion
supabase.bucket.imagen-perfil=imagenPerfil

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HIKARI
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Notificaciones de correo
# Brevo SMTP. Override with MAIL_HOST/MAIL_PORT when needed.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
eventhive.mail.remitente=${MAIL_FROM:${MAIL_USERNAME:no-reply@eventhive.local}}
eventhive.mail.nombre-remitente=EventHive